<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lampshade Generator — Non-Planar 3D Print</title>
    <style>
*, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --surface2: #0f3460;
    --accent: #e94560;
    --accent2: #ff6b6b;
    --text: #eee;
    --text-dim: #999;
    --radius: 8px;
}

body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    height: 100vh;
}

#app {
    display: flex;
    flex-direction: column;
    height: 100vh;
}

header {
    display: flex;
    align-items: baseline;
    gap: 16px;
    padding: 12px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--surface2);
}

header h1 {
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: -0.02em;
}

header .subtitle {
    font-size: 0.8rem;
    color: var(--text-dim);
}

.main-layout {
    display: flex;
    flex: 1;
    overflow: hidden;
}

#controls {
    width: 320px;
    min-width: 320px;
    overflow-y: auto;
    padding: 16px;
    background: var(--surface);
    border-right: 1px solid var(--surface2);
    display: flex;
    flex-direction: column;
    gap: 4px;
}

#controls::-webkit-scrollbar { width: 6px; }
#controls::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 3px; }

.control-group {
    background: rgba(255,255,255,0.03);
    border-radius: var(--radius);
    padding: 12px;
}

.control-group h2 {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--accent);
    margin-bottom: 10px;
}

.control-group label {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    font-size: 0.82rem;
    margin-bottom: 8px;
    gap: 4px;
}

.control-group label:last-child { margin-bottom: 0; }

input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 2px;
    background: var(--surface2);
    outline: none;
    margin-top: 4px;
    order: 3;
    flex-basis: 100%;
}

input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
}

select {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 4px;
    padding: 4px 8px;
    font-size: 0.82rem;
    cursor: pointer;
}

input[type="color"] {
    -webkit-appearance: none;
    appearance: none;
    width: 40px;
    height: 26px;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 4px;
    background: transparent;
    cursor: pointer;
    padding: 1px;
}

input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
input[type="color"]::-webkit-color-swatch { border: none; border-radius: 3px; }

input[type="checkbox"] {
    accent-color: var(--accent);
    width: 16px;
    height: 16px;
    margin-right: 6px;
}

.val {
    font-size: 0.78rem;
    color: var(--accent2);
    font-weight: 600;
    min-width: 36px;
    text-align: right;
}

.actions { display: flex; gap: 8px; margin-top: 8px; }

.btn {
    flex: 1;
    padding: 10px 14px;
    border: none;
    border-radius: var(--radius);
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
}

.btn.primary { background: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent2); }
.btn:not(.primary) { background: var(--surface2); color: var(--text); }
.btn:not(.primary):hover:not(:disabled) { background: #1a4a8a; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

.stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px 12px;
    font-size: 0.78rem;
    color: var(--text-dim);
    background: rgba(255,255,255,0.03);
    border-radius: var(--radius);
    padding: 10px 12px;
    margin-top: 8px;
}

.stats span { color: var(--text); font-weight: 600; }

#viewport-container {
    flex: 1;
    position: relative;
    background: #111;
}

#viewport { width: 100%; height: 100%; display: block; }

#viewport-hint {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.72rem;
    color: rgba(255,255,255,0.3);
    pointer-events: none;
}

#view-toggles {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 2px;
    background: rgba(0,0,0,0.6);
    border-radius: 6px;
    padding: 3px;
}

.view-btn {
    background: transparent;
    border: none;
    color: var(--text-dim);
    padding: 6px 16px;
    font-size: 0.78rem;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s;
}

.view-btn.active { background: var(--accent); color: #fff; }

@media (max-width: 800px) {
    .main-layout { flex-direction: column; }
    #controls {
        width: 100%;
        min-width: unset;
        max-height: 45vh;
        border-right: none;
        border-bottom: 1px solid var(--surface2);
    }
}
    </style>
</head>
<body>
    <div id="app">
        <header>
            <h1>Lampshade Generator</h1>
            <span class="subtitle">Non-Planar G-code for Bambu Lab A1 Mini</span>
        </header>

        <div class="main-layout">
            <aside id="controls">
                <section class="control-group">
                    <h2>Shape</h2>
                    <label>
                        Profile
                        <select id="profile">
                            <option value="cylinder">Cylinder</option>
                            <option value="cone">Cone</option>
                            <option value="bulge">Bulge</option>
                            <option value="hourglass">Hourglass</option>
                            <option value="trumpet">Trumpet</option>
                            <option value="wave" selected>Wave</option>
                        </select>
                    </label>
                    <label>
                        Bottom Diameter (mm)
                        <input type="range" id="bottomDiameter" min="40" max="180" value="100" step="1">
                        <span class="val" data-for="bottomDiameter">100</span>
                    </label>
                    <label>
                        Top Diameter (mm)
                        <input type="range" id="topDiameter" min="40" max="200" value="120" step="1">
                        <span class="val" data-for="topDiameter">120</span>
                    </label>
                    <label>
                        Height (mm)
                        <input type="range" id="height" min="30" max="180" value="100" step="1">
                        <span class="val" data-for="height">100</span>
                    </label>
                    <label>
                        Sides
                        <input type="range" id="sides" min="3" max="128" value="64" step="1">
                        <span class="val" data-for="sides">64</span>
                    </label>
                </section>

                <section class="control-group">
                    <h2>Wall</h2>
                    <label>
                        Wall Thickness (mm)
                        <input type="range" id="wallThickness" min="0.4" max="2.0" value="0.8" step="0.1">
                        <span class="val" data-for="wallThickness">0.8</span>
                    </label>
                    <label>
                        Layer Height (mm)
                        <input type="range" id="layerHeight" min="0.08" max="0.28" value="0.16" step="0.02">
                        <span class="val" data-for="layerHeight">0.16</span>
                    </label>
                </section>

                <section class="control-group">
                    <h2>Non-Planar Wave</h2>
                    <label>
                        Wave Amplitude (mm)
                        <input type="range" id="waveAmplitude" min="0" max="4.0" value="1.5" step="0.1">
                        <span class="val" data-for="waveAmplitude">1.5</span>

                    <label>
                        Wave Frequency

                        <span class="val" data-for="waveFrequency">6</span>
                    </label>

                        Vertical Waves
                        <input type="range" id="verticalWaves" min="0" max="10" value="3" step="1">
                        <span class="val" data-for="verticalWaves">3</span>

                </section>

                <section class="control-group">
                    <h2>Pattern</h2>
                    <label>
                        Pattern Type
                        <select id="patternType">
                            <option value="none">None (Solid)</option>
                            <option value="diamonds" selected>Diamonds</option>
                            <option value="hexagons">Hexagons</option>
                            <option value="spirals">Spirals</option>
                            <option value="waves">Sine Waves</option>
                            <option value="voronoi">Voronoi</option>

                    <label>
                        Pattern Scale
                        <input type="range" id="patternScale" min="2" max="30" value="10" step="1">
                        <span class="val" data-for="patternScale">10</span>
                    </label>
                    <label>
                        Pattern Depth (% wall)
                        <input type="range" id="patternDepth" min="0" max="100" value="50" step="5">
                        <span class="val" data-for="patternDepth">50</span>
                    </label>
                </section>

                <section class="control-group" id="realisticControls">
                    <h2>Realistic Preview</h2>
                    <label>
                        Material
                        <select id="materialType">
                            <option value="pla" selected>PLA</option>
                            <option value="petg">PETG</option>
                            <option value="silkPla">Silk PLA</option>
                            <option value="tpu">TPU</option>
                        </select>
                    </label>
                    <label>
                        Filament Color
                        <input type="color" id="filamentColor" value="#f5e6d0">
                    </label>
                    <label>
                        Room Brightness
                        <input type="range" id="roomBrightness" min="0" max="100" value="20" step="5">
                        <span class="val" data-for="roomBrightness">20</span>
                    </label>
                    <label>
                        Bulb Intensity
                        <input type="range" id="bulbIntensity" min="0" max="100" value="80" step="5">
                        <span class="val" data-for="bulbIntensity">80</span>
                    </label>
                    <label>
                        Bulb Color Temp (K)
                        <input type="range" id="bulbColorTemp" min="2000" max="6500" value="2700" step="100">
                        <span class="val" data-for="bulbColorTemp">2700</span>
                    </label>
                    <label>
                        Bulb Height (%)
                        <input type="range" id="bulbHeight" min="10" max="90" value="40" step="5">
                        <span class="val" data-for="bulbHeight">40</span>
                    </label>
                </section>

                <section class="control-group">
                    <h2>Base</h2>
                    <label>
                        Base Rings
                        <input type="range" id="baseRings" min="0" max="10" value="3" step="1">
                        <span class="val" data-for="baseRings">3</span>
                    </label>
                    <label>
                        Lip Rings (Top)
                        <input type="range" id="lipRings" min="0" max="10" value="2" step="1">
                        <span class="val" data-for="lipRings">2</span>
                    </label>
                </section>

                <section class="control-group">
                    <h2>Print Settings</h2>
                    <label>
                        Print Speed (mm/s)
                        <input type="range" id="printSpeed" min="10" max="150" value="40" step="5">
                        <span class="val" data-for="printSpeed">40</span>
                    </label>
                    <label>
                        Nozzle Temp (&deg;C)
                        <input type="range" id="nozzleTemp" min="180" max="260" value="215" step="5">
                        <span class="val" data-for="nozzleTemp">215</span>
                    </label>
                    <label>
                        Bed Temp (&deg;C)
                        <input type="range" id="bedTemp" min="40" max="100" value="60" step="5">
                        <span class="val" data-for="bedTemp">60</span>
                    </label>
                    <label>
                        Filament Diameter (mm)
                        <input type="range" id="filamentDiameter" min="1.70" max="1.80" value="1.75" step="0.01">
                        <span class="val" data-for="filamentDiameter">1.75</span>
                    </label>
                    <label>
                        Nozzle Diameter (mm)
                        <select id="nozzleDiameter">
                            <option value="0.2">0.2</option>
                            <option value="0.4" selected>0.4</option>
                            <option value="0.6">0.6</option>
                        </select>
                    </label>
                    <label>
                        Retraction Distance (mm)
                        <input type="range" id="retractionDist" min="0" max="3" value="0.8" step="0.1">
                        <span class="val" data-for="retractionDist">0.8</span>
                    </label>
                    <label>
                        <input type="checkbox" id="spiralMode"> Spiral (Vase) Mode
                    </label>
                </section>

                <div class="actions">
                    <button id="btnGenerate" class="btn primary">Generate G-code</button>
                    <button id="btnDownload" class="btn" disabled>Download .gcode</button>
                </div>

                <div id="stats" class="stats" style="display:none">
                    <div>Layers: <span id="statLayers">-</span></div>
                    <div>Est. Time: <span id="statTime">-</span></div>
                    <div>Est. Filament: <span id="statFilament">-</span></div>
                    <div>Lines of G-code: <span id="statLines">-</span></div>
                </div>
            </aside>

            <main id="viewport-container">
                <canvas id="viewport"></canvas>
                <div id="viewport-hint">Drag to rotate &middot; Scroll to zoom</div>
                <div id="view-toggles">
                    <button class="view-btn active" data-view="shape">Shape</button>
                    <button class="view-btn" data-view="realistic">Realistic</button>
                    <button class="view-btn" data-view="gcode">G-code</button>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
// ============================================================
// Lampshade Geometry Generator
// ============================================================
const LampshadeGeometry = (() => {
    const profiles = {
        cylinder(t, bottomR, topR) { return bottomR + (topR - bottomR) * t; },
        cone(t, bottomR, topR) { return bottomR + (topR - bottomR) * t; },
        bulge(t, bottomR, topR) {
            const base = bottomR + (topR - bottomR) * t;
            return base + Math.sin(t * Math.PI) * 0.3 * (bottomR + topR) / 2;
        },
        hourglass(t, bottomR, topR) {
            const base = bottomR + (topR - bottomR) * t;
            return Math.max(base - Math.sin(t * Math.PI) * 0.25 * (bottomR + topR) / 2, 5);
        },
        trumpet(t, bottomR, topR) { return bottomR + (topR - bottomR) * t * t; },
        wave(t, bottomR, topR) {
            const base = bottomR + (topR - bottomR) * t;
            return base + Math.sin(t * Math.PI * 3) * 0.1 * (bottomR + topR) / 2;
        }
    };

    function generate(params) {
        const { profile = 'wave', bottomDiameter = 100, topDiameter = 120, height = 100,
                sides = 64, layerHeight = 0.16, waveAmplitude = 1.5, waveFrequency = 6,
                verticalWaves = 3 } = params;
        const bottomR = bottomDiameter / 2, topR = topDiameter / 2;
        const profileFn = profiles[profile] || profiles.cylinder;
        const layerCount = Math.ceil(height / layerHeight);
        const rings = [];
        for (let layer = 0; layer <= layerCount; layer++) {
            const t = layer / layerCount, z = t * height;
            const baseRadius = profileFn(t, bottomR, topR);
            const ring = [];
            for (let s = 0; s < sides; s++) {
                const angle = (s / sides) * Math.PI * 2;
                let zOffset = 0;
                if (waveAmplitude > 0) zOffset = waveAmplitude * Math.sin(angle * waveFrequency + t * verticalWaves * Math.PI * 2);
                let rOffset = 0;
                if (verticalWaves > 0 && waveAmplitude > 0) rOffset = (waveAmplitude * 0.3) * Math.cos(angle * waveFrequency * 0.5 + t * verticalWaves * Math.PI);
                const r = baseRadius + rOffset;
                ring.push({ x: r * Math.cos(angle), y: r * Math.sin(angle), z: z + zOffset, radius: r, angle, layer, t });
            }
            rings.push(ring);
        }
        return { rings, layerCount, totalHeight: height };
    }

    function buildMesh(rings) {
        const geometry = new THREE.BufferGeometry();
        const vertices = [], normals = [], uvs = [], indices = [];
        const sides = rings[0].length, layers = rings.length;
        for (let l = 0; l < layers; l++) {
            for (let s = 0; s < sides; s++) {
                const p = rings[l][s];
                vertices.push(p.x, p.z, p.y);
                const len = Math.sqrt(p.x * p.x + p.y * p.y) || 1;
                normals.push(p.x / len, 0, p.y / len);
                uvs.push(s / sides, l / (layers - 1));
            }
        }
        for (let l = 0; l < layers - 1; l++) {
            for (let s = 0; s < sides; s++) {
                const s2 = (s + 1) % sides, a = l * sides + s, b = l * sides + s2,
                      c = (l + 1) * sides + s2, d = (l + 1) * sides + s;
                indices.push(a, b, c, a, c, d);
            }
        }
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        geometry.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
        geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
        geometry.setIndex(indices);
        geometry.computeVertexNormals();
        const material = new THREE.MeshPhysicalMaterial({
            color: 0xffeedd, transparent: true, opacity: 0.7, roughness: 0.4,
            metalness: 0.0, transmission: 0.3, thickness: 1.0, side: THREE.DoubleSide
        });
        return new THREE.Mesh(geometry, material);
    }

    function buildWireframe(rings) {
        const geometry = new THREE.BufferGeometry();
        const vertices = [], sides = rings[0].length, layers = rings.length;
        const layerStep = Math.max(1, Math.floor(layers / 40));
        for (let l = 0; l < layers; l += layerStep) {
            for (let s = 0; s < sides; s++) {
                const s2 = (s + 1) % sides, p1 = rings[l][s], p2 = rings[l][s2];
                vertices.push(p1.x, p1.z, p1.y, p2.x, p2.z, p2.y);
            }
        }
        const segStep = Math.max(1, Math.floor(sides / 16));
        for (let s = 0; s < sides; s += segStep) {
            for (let l = 0; l < layers - 1; l++) {
                const p1 = rings[l][s], p2 = rings[l + 1][s];
                vertices.push(p1.x, p1.z, p1.y, p2.x, p2.z, p2.y);
            }
        }
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        return new THREE.LineSegments(geometry, new THREE.LineBasicMaterial({ color: 0xe94560, transparent: true, opacity: 0.15 }));
    }

    return { generate, buildMesh, buildWireframe, profiles };
})();

// ============================================================
// Patterns
// ============================================================
const Patterns = (() => {
    function none() { return 1.0; }
    function diamonds(u, v, scale, depth) {
        const dx = Math.abs((u * scale % 1) - 0.5) * 2, dy = Math.abs((v * scale % 1) - 0.5) * 2;
        return (dx + dy) < 0.7 ? 1.0 - depth : 1.0;
    }
    function hexagons(u, v, scale, depth) {
        const sv = v * scale * 0.866, row = Math.floor(sv), col = u * scale + (row % 2 === 0 ? 0 : 0.5);
        const cx = (col % 1) - 0.5, cy = (sv % 1) - 0.5;
        return Math.sqrt(cx * cx + cy * cy) < 0.35 ? 1.0 - depth : 1.0;
    }
    function spirals(u, v, scale, depth) {
        const spiralCount = Math.max(1, Math.floor(scale / 3));
        return Math.sin(u * Math.PI * 2 * spiralCount + v * scale * 0.5) > 0.3 ? 1.0 : 1.0 - depth;
    }
    function waves(u, v, scale, depth) {
        const wv = Math.sin(u * Math.PI * 2 * scale) * 0.5 + 0.5;
        const st = Math.sin(v * Math.PI * 2 * scale * 2) * 0.5 + 0.5;
        return (wv * 0.5 + st * 0.5) > 0.55 ? 1.0 : 1.0 - depth;
    }
    function voronoi(u, v, scale, depth) {
        const su = u * scale, sv = v * scale, cx = Math.floor(su), cy = Math.floor(sv);
        let d1 = 999, d2 = 999;
        for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
            const h = hash2d(cx + dx, cy + dy);
            const d = Math.sqrt((su - cx - dx - h.x) ** 2 + (sv - cy - dy - h.y) ** 2);
            if (d < d1) { d2 = d1; d1 = d; } else if (d < d2) { d2 = d; }
        }
        return (d2 - d1) < 0.12 ? 1.0 : 1.0 - depth;
    }
    function hash2d(x, y) {
        let h = x * 374761393 + y * 668265263;
        h = (h ^ (h >> 13)) * 1274126177; h = h ^ (h >> 16);
        return { x: ((h & 0xFFFF) / 0xFFFF) * 0.8 + 0.1, y: (((h >> 16) & 0xFFFF) / 0xFFFF) * 0.8 + 0.1 };
    }
    const patternMap = { none, diamonds, hexagons, spirals, waves, voronoi };
    function sample(type, u, v, scale, depthPct) {
        if (type === 'none') return 1.0;
        const fn = patternMap[type] || none;
        return fn(u, v, scale, Math.min(1, Math.max(0, depthPct / 100)));
    }
    return { sample, patternMap };
})();

// ============================================================
// G-code Generator
// ============================================================
const GcodeGenerator = (() => {
    function generate(rings, params) {
        const { height = 100, sides = 64, layerHeight = 0.16, wallThickness = 0.8,
            nozzleTemp = 215, bedTemp = 60, printSpeed = 40, filamentDiameter = 1.75,
            nozzleDiameter = 0.4, retractionDist = 0.8, patternType = 'none',
            patternScale = 10, patternDepth = 50, baseRings = 3, lipRings = 2,
            spiralMode = false, waveAmplitude = 1.5 } = params;
        const lines = [], toolpaths = [];
        let E = 0, lastX = 0, lastY = 0, lastZ = 0, totalMoves = 0;
        const filamentArea = Math.PI * (filamentDiameter / 2) ** 2;
        const extrusionMultiplier = (nozzleDiameter * 1.05 * layerHeight) / filamentArea;
        function emit(t) { lines.push(t); }
        function moveTo(x, y, z, f) { emit(`G0 X${x.toFixed(3)} Y${y.toFixed(3)} Z${z.toFixed(3)} F${f}`); lastX=x;lastY=y;lastZ=z; }
        function extrudeTo(x, y, z, f) {
            const d = Math.sqrt((x-lastX)**2+(y-lastY)**2+(z-lastZ)**2); E += d*extrusionMultiplier;
            emit(`G1 X${x.toFixed(3)} Y${y.toFixed(3)} Z${z.toFixed(3)} E${E.toFixed(5)} F${f}`); lastX=x;lastY=y;lastZ=z; totalMoves++;
        }
        function retract() { if(retractionDist>0){E-=retractionDist;emit(`G1 E${E.toFixed(5)} F2400`);} }
        function unretract() { if(retractionDist>0){E+=retractionDist;emit(`G1 E${E.toFixed(5)} F2400`);} }

        emit('; Generated by Lampshade Generator'); emit('; Target: Bambu Lab A1 Mini');
        emit(`; Layer height: ${layerHeight}mm`); emit(`; Wall thickness: ${wallThickness}mm`);
        emit(`; Non-planar amplitude: ${waveAmplitude}mm`); emit(`; Pattern: ${patternType}`); emit('');
        emit('; ====== START GCODE ======');
        emit('G90 ; Absolute positioning'); emit('M82 ; Absolute extrusion');
        emit(`M104 S${nozzleTemp}`); emit(`M140 S${bedTemp}`); emit(`M190 S${bedTemp}`); emit(`M109 S${nozzleTemp}`);
        emit('G28'); emit('G29'); emit('G92 E0'); emit('');
        emit('; Prime line'); emit('G1 Z2.0 F3000'); emit('G1 X5 Y5 F3000'); emit('G1 Z0.3 F1000');
        emit('G1 X60 Y5 E10 F1500'); emit('G1 X60 Y5.4 E10.2 F1500'); emit('G1 X5 Y5.4 E20 F1500');
        emit('G92 E0'); emit(''); E = 0;
        const cX=90,cY=90, feedRate=printSpeed*60, travelRate=9000, firstLayerFeed=Math.min(feedRate,1200);
        const layerCount=rings.length-1, wallPasses=Math.max(1,Math.round(wallThickness/nozzleDiameter));
        for (let layer=0;layer<=layerCount;layer++) {
            const ring=rings[layer], t=layer/layerCount;
            const isBase=layer<baseRings*Math.ceil(1/layerHeight), isLip=layer>layerCount-lipRings*Math.ceil(1/layerHeight);
            const cf=layer<3?firstLayerFeed:feedRate;
            emit(''); emit(`; ====== LAYER ${layer} Z~${ring[0].z.toFixed(2)} ======`);
            const lp=[], passes=(isBase||isLip)?wallPasses+1:wallPasses;
            for (let pass=0;pass<passes;pass++) {
                const off=pass*nozzleDiameter;
                if (spiralMode&&pass===0&&!isBase&&!isLip) {
                    for (let s=0;s<sides;s++) {
                        const pt=ring[s], nZ=layer<layerCount?rings[layer+1][s].z:pt.z;
                        const iZ=pt.z+(nZ-pt.z)*(s/sides), r=pt.radius-off;
                        if(r<=0)continue;
                        const x=cX+r*Math.cos(pt.angle),y=cY+r*Math.sin(pt.angle),z=iZ;
                        const wm=Patterns.sample(patternType,s/sides,t,patternScale,patternDepth);
                        if(wm<0.1&&!isBase&&!isLip){retract();moveTo(x,y,z,travelRate);unretract();}
                        else{if(s===0&&pass===0){retract();moveTo(x,y,z,travelRate);unretract();}extrudeTo(x,y,z,cf);}
                        lp.push({x,y:z,z:y,extrude:wm>=0.1});
                    }
                } else {
                    let nt=true;
                    for(let s=0;s<=sides;s++){
                        const idx=s%sides, pt=ring[idx], r=pt.radius-off;
                        if(r<=0)continue;
                        const x=cX+r*Math.cos(pt.angle),y=cY+r*Math.sin(pt.angle),z=pt.z;
                        const wm=Patterns.sample(patternType,idx/sides,t,patternScale,patternDepth);
                        if(wm<0.1&&!isBase&&!isLip){if(!nt){retract();nt=true;}lp.push({x,y:z,z:y,extrude:false});continue;}
                        if(nt){moveTo(x,y,z,travelRate);unretract();nt=false;}
                        extrudeTo(x,y,z,cf);lp.push({x,y:z,z:y,extrude:true});
                    }
                    if(!nt)retract();
                }
            }
            toolpaths.push(lp);
        }
        emit(''); emit('; ====== END GCODE ======');
        emit('G91'); emit('G1 E-2 F1800'); emit('G1 Z10 F3000'); emit('G90');
        emit('G1 X5 Y170 F9000'); emit('M104 S0'); emit('M140 S0'); emit('M107'); emit('M84'); emit('; Done!');
        const em=((totalMoves/(printSpeed*60))*60+layerCount*0.5);
        return { gcode:lines.join('\n'), stats:{layers:layerCount,lines:lines.length,filamentMm:E.toFixed(1),
            filamentM:(E/1000).toFixed(2),estimatedMinutes:Math.ceil(em),
            estimatedTime:(Math.floor(em/60)>0?Math.floor(em/60)+'h ':'')+Math.ceil(em%60)+'m'}, toolpaths };
    }
    function validate(p) {
        const w=[], mx=180;
        const mr=Math.max(p.bottomDiameter,p.topDiameter)/2;
        if(mr*2>mx)w.push(`Diameter ${mr*2}mm exceeds bed width (${mx}mm)`);
        if(p.height>mx)w.push(`Height ${p.height}mm exceeds build height`);
        if(p.waveAmplitude>p.layerHeight*3)w.push('Wave amplitude >3x layer height — nozzle collision risk');
        if(p.height+p.waveAmplitude>mx)w.push('Total height with waves exceeds build volume');
        return w;
    }
    return { generate, validate };
})();

// ============================================================
// G-code Toolpath Preview
// ============================================================
const GcodePreview = (() => {
    function build(toolpaths) {
        const group = new THREE.Group();
        const cBot = new THREE.Color(0x2196f3), cTop = new THREE.Color(0xe94560);
        const step = Math.max(1, Math.floor(toolpaths.length / 2000));
        for (let l = 0; l < toolpaths.length; l += step) {
            const layer = toolpaths[l];
            if (!layer || layer.length < 2) continue;
            const t = l / (toolpaths.length - 1 || 1), color = cBot.clone().lerp(cTop, t);
            const ev = [], tv = [];
            for (let i = 1; i < layer.length; i++) {
                const p = layer[i-1], c = layer[i];
                if (c.extrude) { ev.push(p.x,p.y,p.z, c.x,c.y,c.z); }
                else { tv.push(p.x,p.y,p.z, c.x,c.y,c.z); }
            }
            if (ev.length) { const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(ev,3)); group.add(new THREE.LineSegments(g,new THREE.LineBasicMaterial({color}))); }
            if (tv.length) { const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(tv,3)); group.add(new THREE.LineSegments(g,new THREE.LineBasicMaterial({color:0x333333,transparent:true,opacity:0.2}))); }
        }
        group.position.set(-90, 0, -90);
        return group;
    }
    return { build };
})();

// ============================================================
// Realistic Preview Renderer
// ============================================================
const RealisticPreview = (() => {
    const MATERIALS = {
        pla: {
            label: 'PLA', transmission: 0.12, roughness: 0.65, metalness: 0.0,
            ior: 1.46, clearcoat: 0.05, clearcoatRoughness: 0.7,
            subsurfaceTint: [1.0, 0.92, 0.85], layerLineStrength: 0.35,
        },
        petg: {
            label: 'PETG', transmission: 0.40, roughness: 0.25, metalness: 0.0,
            ior: 1.57, clearcoat: 0.3, clearcoatRoughness: 0.3,
            subsurfaceTint: [1.0, 0.97, 0.95], layerLineStrength: 0.15,
        },
        silkPla: {
            label: 'Silk PLA', transmission: 0.08, roughness: 0.15, metalness: 0.45,
            ior: 1.46, clearcoat: 0.6, clearcoatRoughness: 0.1,
            subsurfaceTint: [1.0, 0.95, 0.9], layerLineStrength: 0.10,
        },
        tpu: {
            label: 'TPU', transmission: 0.22, roughness: 0.55, metalness: 0.0,
            ior: 1.5, clearcoat: 0.0, clearcoatRoughness: 0.9,
            subsurfaceTint: [1.0, 0.95, 0.92], layerLineStrength: 0.20,
        },
    };

    function colorTempToRGB(kelvin) {
        const temp = kelvin / 100;
        let r, g, b;
        if (temp <= 66) {
            r = 255;
            g = 99.4708025861 * Math.log(temp) - 161.1195681661;
            b = temp <= 19 ? 0 : 138.5177312231 * Math.log(temp - 10) - 305.0447927307;
        } else {
            r = 329.698727446 * Math.pow(temp - 60, -0.1332047592);
            g = 288.1221695283 * Math.pow(temp - 60, -0.0755148492);
            b = 255;
        }
        return new THREE.Color(
            Math.min(1, Math.max(0, r / 255)),
            Math.min(1, Math.max(0, g / 255)),
            Math.min(1, Math.max(0, b / 255))
        );
    }

    function generatePatternTexture(params, filamentColorHex, matPreset) {
        const W = 512, H = 512, canvas = document.createElement('canvas');
        canvas.width = W; canvas.height = H;
        const ctx = canvas.getContext('2d');
        const fc = new THREE.Color(filamentColorHex);
        const { patternType='none', patternScale=10, patternDepth=50, layerHeight=0.16, height=100 } = params;
        const layerCount = Math.ceil(height / layerHeight);
        const lls = matPreset.layerLineStrength;
        const imageData = ctx.createImageData(W, H);
        const data = imageData.data;
        for (let py = 0; py < H; py++) {
            const vH = 1 - py / H;
            const layerLine = 1.0 - lls * (1.0 - Math.abs(((vH * layerCount) % 1) - 0.5) * 2);
            for (let px = 0; px < W; px++) {
                const u = px / W;
                const wallMult = Patterns.sample(patternType, u, vH, patternScale, patternDepth);
                const idx = (py * W + px) * 4;
                data[idx]     = Math.round(fc.r * layerLine * 255);
                data[idx + 1] = Math.round(fc.g * layerLine * 255);
                data[idx + 2] = Math.round(fc.b * layerLine * 255);
                data[idx + 3] = Math.round(wallMult * 255);
            }
        }
        ctx.putImageData(imageData, 0, 0);
        const tex = new THREE.CanvasTexture(canvas);
        tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.ClampToEdgeWrapping;
        return tex;
    }

    function generateEmissiveTexture(params, filamentColorHex, matPreset, bulbColor) {
        const W = 512, H = 512, canvas = document.createElement('canvas');
        canvas.width = W; canvas.height = H;
        const ctx = canvas.getContext('2d');
        const fc = new THREE.Color(filamentColorHex);
        const tint = matPreset.subsurfaceTint;
        const { patternType='none', patternScale=10, patternDepth=50 } = params;
        const baseTr = matPreset.transmission;
        const imageData = ctx.createImageData(W, H);
        const data = imageData.data;
        for (let py = 0; py < H; py++) {
            const v = 1 - py / H;
            for (let px = 0; px < W; px++) {
                const u = px / W;
                const wm = Patterns.sample(patternType, u, v, patternScale, patternDepth);
                const tr = wm < 0.1 ? 1.0 : baseTr * (1.0 - wm * 0.5);
                const idx = (py * W + px) * 4;
                data[idx]     = Math.min(255, Math.round(bulbColor.r * fc.r * tint[0] * tr * 255));
                data[idx + 1] = Math.min(255, Math.round(bulbColor.g * fc.g * tint[1] * tr * 255));
                data[idx + 2] = Math.min(255, Math.round(bulbColor.b * fc.b * tint[2] * tr * 255));
                data[idx + 3] = 255;
            }
        }
        ctx.putImageData(imageData, 0, 0);
        const tex = new THREE.CanvasTexture(canvas);
        tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.ClampToEdgeWrapping;
        return tex;
    }

    function build(rings, params, rp) {
        const { materialType='pla', filamentColor='#f5e6d0', roomBrightness=20,
                bulbIntensity=80, bulbColorTemp=2700, bulbHeight=40 } = rp;
        const mat = MATERIALS[materialType] || MATERIALS.pla;
        const bulbColor = colorTempToRGB(bulbColorTemp);
        const group = new THREE.Group();

        // Build geometry
        const geo = new THREE.BufferGeometry();
        const verts = [], norms = [], uvs = [], idx = [];
        const sides = rings[0].length, layers = rings.length;
        for (let l = 0; l < layers; l++) for (let s = 0; s < sides; s++) {
            const p = rings[l][s];
            verts.push(p.x, p.z, p.y);
            const len = Math.sqrt(p.x*p.x + p.y*p.y) || 1;
            norms.push(p.x/len, 0, p.y/len);
            uvs.push(s/sides, l/(layers-1));
        }
        for (let l = 0; l < layers-1; l++) for (let s = 0; s < sides; s++) {
            const s2=(s+1)%sides, a=l*sides+s, b=l*sides+s2, c=(l+1)*sides+s2, d=(l+1)*sides+s;
            idx.push(a,b,c, a,c,d);
        }
        geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
        geo.setAttribute('normal', new THREE.Float32BufferAttribute(norms, 3));
        geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
        geo.setIndex(idx);
        geo.computeVertexNormals();

        const patTex = generatePatternTexture(params, filamentColor, mat);
        const emTex = generateEmissiveTexture(params, filamentColor, mat, bulbColor);

        const material = new THREE.MeshPhysicalMaterial({
            map: patTex, emissiveMap: emTex, emissive: new THREE.Color(1,1,1),
            emissiveIntensity: bulbIntensity / 100 * 1.5,
            transparent: true, alphaTest: 0.01,
            roughness: mat.roughness, metalness: mat.metalness,
            clearcoat: mat.clearcoat || 0, clearcoatRoughness: mat.clearcoatRoughness || 0,
            side: THREE.DoubleSide, depthWrite: true,
        });
        group.add(new THREE.Mesh(geo, material));

        // Bulb
        const bulbY = params.height * (bulbHeight / 100);
        const bulbGeo = new THREE.SphereGeometry(3, 16, 16);
        const bulbMat = new THREE.MeshBasicMaterial({ color: bulbColor, transparent: true, opacity: bulbIntensity/100 });
        const bulbMesh = new THREE.Mesh(bulbGeo, bulbMat);
        bulbMesh.position.set(0, bulbY, 0);
        group.add(bulbMesh);

        const bulbLight = new THREE.PointLight(bulbColor, bulbIntensity/100*3.0, params.height*4);
        bulbLight.position.set(0, bulbY, 0);
        group.add(bulbLight);

        const sssLight = new THREE.PointLight(bulbColor, bulbIntensity/100*1.0, params.height*2);
        sssLight.position.set(0, bulbY*0.6, 0);
        group.add(sssLight);

        // Floor
        const floorGeo = new THREE.CircleGeometry(params.height * 1.2, 64);
        const floorMat = new THREE.MeshPhysicalMaterial({ color: 0x888888, roughness: 0.8, side: THREE.DoubleSide });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2; floor.position.y = -0.5;
        group.add(floor);

        function dispose() { geo.dispose(); material.dispose(); patTex.dispose(); emTex.dispose(); bulbGeo.dispose(); bulbMat.dispose(); floorGeo.dispose(); floorMat.dispose(); }
        return { group, bulbLight, dispose };
    }

    return { build, MATERIALS, colorTempToRGB };
})();

// ============================================================
// Main Application
// ============================================================
(function () {
    'use strict';

    const canvas = document.getElementById('viewport');
    const container = document.getElementById('viewport-container');

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x111111);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 2000);
    camera.position.set(120, 120, 180);

    const controls = new THREE.OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(0, 50, 0);
    controls.update();

    const ambient = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambient);
    const keyLight = new THREE.DirectionalLight(0xffffff, 0.8);
    keyLight.position.set(100, 200, 150);
    scene.add(keyLight);
    const fillLight = new THREE.DirectionalLight(0x8888ff, 0.3);
    fillLight.position.set(-100, 50, -100);
    scene.add(fillLight);
    const innerLight = new THREE.PointLight(0xffcc88, 1.5, 300);
    innerLight.position.set(0, 50, 0);
    scene.add(innerLight);

    const gridHelper = new THREE.GridHelper(180, 18, 0x333333, 0x222222);
    scene.add(gridHelper);
    const boxGeo = new THREE.BoxGeometry(180, 180, 180);
    const boxLine = new THREE.LineSegments(new THREE.EdgesGeometry(boxGeo),
        new THREE.LineBasicMaterial({ color: 0x333344, transparent: true, opacity: 0.3 }));
    boxLine.position.y = 90;
    scene.add(boxLine);

    let shapeMesh = null, shapeWireframe = null, gcodePreviewObj = null;
    let realisticObj = null, realisticDispose = null;
    let currentView = 'shape', generatedGcode = null;

    const paramIds = [
        'profile','bottomDiameter','topDiameter','height','sides',
        'wallThickness','layerHeight','waveAmplitude','waveFrequency','verticalWaves',
        'patternType','patternScale','patternDepth','baseRings','lipRings',
        'printSpeed','nozzleTemp','bedTemp','filamentDiameter','nozzleDiameter','retractionDist','spiralMode'
    ];
    const realisticParamIds = ['materialType','filamentColor','roomBrightness','bulbIntensity','bulbColorTemp','bulbHeight'];

    function getParams() {
        const p = {};
        paramIds.forEach(id => {
            const el = document.getElementById(id);
            if (!el) return;
            if (el.type === 'checkbox') p[id] = el.checked;
            else if (el.type === 'range') p[id] = parseFloat(el.value);
            else if (el.tagName === 'SELECT') { const v = el.value; p[id] = isNaN(v) ? v : parseFloat(v); }
        });
        return p;
    }

    function getRealisticParams() {
        return {
            materialType: document.getElementById('materialType').value,
            filamentColor: document.getElementById('filamentColor').value,
            roomBrightness: parseFloat(document.getElementById('roomBrightness').value),
            bulbIntensity: parseFloat(document.getElementById('bulbIntensity').value),
            bulbColorTemp: parseFloat(document.getElementById('bulbColorTemp').value),
            bulbHeight: parseFloat(document.getElementById('bulbHeight').value),
        };
    }

    document.querySelectorAll('.val[data-for]').forEach(span => {
        const input = document.getElementById(span.dataset.for);
        if (input) input.addEventListener('input', () => { span.textContent = input.value; });
    });

    let previewTimeout = null;
    paramIds.forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('input', () => { clearTimeout(previewTimeout); previewTimeout = setTimeout(updatePreview, 100); });
        el.addEventListener('change', () => { clearTimeout(previewTimeout); previewTimeout = setTimeout(updatePreview, 50); });
    });

    let realisticTimeout = null;
    realisticParamIds.forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('input', () => { clearTimeout(realisticTimeout); realisticTimeout = setTimeout(() => { if (currentView === 'realistic') updateRealisticPreview(); }, 120); });
        el.addEventListener('change', () => { clearTimeout(realisticTimeout); realisticTimeout = setTimeout(() => { if (currentView === 'realistic') updateRealisticPreview(); }, 60); });
    });

    function updatePreview() {
        const params = getParams();
        const { rings } = LampshadeGeometry.generate(params);
        if (shapeMesh) { scene.remove(shapeMesh); shapeMesh.geometry.dispose(); }
        if (shapeWireframe) { scene.remove(shapeWireframe); shapeWireframe.geometry.dispose(); }
        shapeMesh = LampshadeGeometry.buildMesh(rings);
        shapeWireframe = LampshadeGeometry.buildWireframe(rings);
        scene.add(shapeMesh); scene.add(shapeWireframe);
        innerLight.position.y = params.height / 2;
        shapeMesh.visible = (currentView === 'shape');
        shapeWireframe.visible = (currentView === 'shape');
        if (gcodePreviewObj) gcodePreviewObj.visible = (currentView === 'gcode');
        if (currentView === 'realistic') updateRealisticPreview();
        else if (realisticObj) realisticObj.visible = false;
        generatedGcode = null;
        document.getElementById('btnDownload').disabled = true;
        document.getElementById('stats').style.display = 'none';
    }

    function updateRealisticPreview() {
        if (realisticObj) { scene.remove(realisticObj); if (realisticDispose) realisticDispose(); realisticObj = null; realisticDispose = null; }
        const params = getParams(), rp = getRealisticParams();
        const { rings } = LampshadeGeometry.generate(params);
        const result = RealisticPreview.build(rings, params, rp);
        realisticObj = result.group; realisticDispose = result.dispose;
        scene.add(realisticObj);
        applyRealisticLighting(rp);
        realisticObj.visible = true;
    }

    function applyRealisticLighting(rp) {
        const rf = rp.roomBrightness / 100;
        ambient.intensity = 0.05 + rf * 0.4;
        keyLight.intensity = rf * 0.5;
        fillLight.intensity = rf * 0.2;
        innerLight.visible = false;
        const a = new THREE.Color(0x050508), b = new THREE.Color(0x222233);
        renderer.setClearColor(a.lerp(b, rf));
    }

    function restoreDefaultLighting() {
        ambient.intensity = 0.4; keyLight.intensity = 0.8; fillLight.intensity = 0.3;
        innerLight.visible = true; renderer.setClearColor(0x111111);
    }

    document.getElementById('btnGenerate').addEventListener('click', () => {
        const params = getParams();
        const warnings = GcodeGenerator.validate(params);
        if (warnings.length > 0) alert('Warnings:\n' + warnings.join('\n') + '\n\nGeneration will proceed.');
        const btn = document.getElementById('btnGenerate');
        btn.textContent = 'Generating...'; btn.disabled = true;
        setTimeout(() => {
            try {
                const { rings } = LampshadeGeometry.generate(params);
                const result = GcodeGenerator.generate(rings, params);
                generatedGcode = result.gcode;
                document.getElementById('statLayers').textContent = result.stats.layers;
                document.getElementById('statTime').textContent = result.stats.estimatedTime;
                document.getElementById('statFilament').textContent = result.stats.filamentM + ' m';
                document.getElementById('statLines').textContent = result.stats.lines.toLocaleString();
                document.getElementById('stats').style.display = 'grid';
                if (gcodePreviewObj) { scene.remove(gcodePreviewObj); gcodePreviewObj.traverse(c => { if(c.geometry)c.geometry.dispose(); if(c.material)c.material.dispose(); }); }
                gcodePreviewObj = GcodePreview.build(result.toolpaths);
                scene.add(gcodePreviewObj);
                gcodePreviewObj.visible = (currentView === 'gcode');
                document.getElementById('btnDownload').disabled = false;
            } catch (err) { console.error(err); alert('Error: ' + err.message); }
            btn.textContent = 'Generate G-code'; btn.disabled = false;
        }, 50);
    });

    document.getElementById('btnDownload').addEventListener('click', () => {
        if (!generatedGcode) return;
        const blob = new Blob([generatedGcode], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = 'lampshade.gcode';
        document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
    });

    document.querySelectorAll('.view-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const prev = currentView;
            document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentView = btn.dataset.view;
            if (shapeMesh) shapeMesh.visible = (currentView === 'shape');
            if (shapeWireframe) shapeWireframe.visible = (currentView === 'shape');
            if (gcodePreviewObj) gcodePreviewObj.visible = (currentView === 'gcode');
            boxLine.visible = (currentView !== 'realistic');
            gridHelper.visible = (currentView !== 'realistic');
            if (currentView === 'realistic') updateRealisticPreview();
            else { if (realisticObj) realisticObj.visible = false; if (prev === 'realistic') restoreDefaultLighting(); }
        });
    });

    function onResize() {
        const w = container.clientWidth, h = container.clientHeight;
        camera.aspect = w / h; camera.updateProjectionMatrix(); renderer.setSize(w, h);
    }
    window.addEventListener('resize', onResize);
    function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
    onResize(); updatePreview(); animate();
})();
</script>
